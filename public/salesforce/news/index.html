<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salesforce News · Maruf Bagwan</title>
<meta name="description" content="Curated Salesforce news: product, AI, releases and platform.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/site.css">
</head>
<body class="sf">
<div class="wrap">
  <header class="site-header">
    <a class="brand" href="https://salesforce.marufbagwan.com/">Maruf Bagwan<span class="dot">.</span> <span class="sub">salesforce</span></a>
    <nav aria-label="Salesforce hub">
      <ul class="tabs">
        <li><a href="https://salesforce.marufbagwan.com/">Hub</a></li>
        <li><a href="https://salesforce.marufbagwan.com/quiz/">Quiz</a></li>
        <li><a href="https://salesforce.marufbagwan.com/releases/">Releases</a></li>
        <li><a href="https://salesforce.marufbagwan.com/news/" aria-current="page">News</a></li>
        <li><a class="out" href="https://marufbagwan.com/">Main site</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="page-head">
      <p class="eyebrow">News</p>
      <h1>Salesforce news</h1>
      <p class="lede">Hand-picked stories on products, AI, releases and the platform. <span id="updated"></span></p>
    </div>

    <section>
      <div class="toolbar">
        <div class="chips" id="tags" role="group" aria-label="Filter by topic"></div>
        <input class="search" id="q" type="search" placeholder="Search news" aria-label="Search news">
      </div>
      <ul class="feed" id="feed"></ul>
    </section>
  </main>

  <footer class="site-foot">
    <span>Curated by <a href="https://marufbagwan.com/">Mohammed Maruf Bagwan</a> · Not affiliated with Salesforce, Inc.</span>
    <a href="https://marufbagwan.com/about/">About me</a>
  </footer>
</div>

<script src="../assets/news.js"></script>
<script src="../assets/site.js" data-root="../../" data-site="sf"></script>
<script src="../assets/hub.js"></script>
<script>
(function () {
  var data = window.NEWS, esc = MB.esc;
  document.getElementById("updated").textContent = "Last updated " + MB.fmtDate(window.NEWS_UPDATED) + ".";
  var tags = ["All"].concat(data.map(function (n) { return n.tag; }).filter(function (t, i, a) { return a.indexOf(t) === i; }).sort());
  var st = { tag: "All", q: "" };
  var tagEl = document.getElementById("tags"), feed = document.getElementById("feed");
  function render() {
    tagEl.innerHTML = tags.map(function (t) {
      var n = t === "All" ? data.length : data.filter(function (x) { return x.tag === t; }).length;
      return '<button class="chip" type="button" data-t="' + esc(t) + '" aria-pressed="' + (t === st.tag) + '">' + esc(t) + '<span class="n">' + n + '</span></button>';
    }).join("");
    var q = st.q.toLowerCase();
    var items = data.filter(function (n) {
      return (st.tag === "All" || n.tag === st.tag) && (!q || (n.title + " " + n.summary).toLowerCase().indexOf(q) > -1);
    });
    feed.innerHTML = items.length ? items.map(HUB.newsRow).join("") : '<li><p class="empty">No stories match. Try another filter.</p></li>';
  }
  tagEl.addEventListener("click", function (e) { var b = e.target.closest("[data-t]"); if (b) { st.tag = b.dataset.t; render(); } });
  document.getElementById("q").addEventListener("input", function (e) { st.q = e.target.value.trim(); render(); });
  render();
})();
</script>
</body>
</html>
